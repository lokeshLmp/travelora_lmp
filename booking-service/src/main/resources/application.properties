spring.application.name=booking-service

# Render provides PORT; locally the service listens on 8081.
server.port=${PORT:8081}

# Optional local file booking-service/.env (never committed) with lines like MONGODB_URI=...
# Real environment variables (for example set in the Render dashboard) always take priority.
spring.config.import=optional:file:./.env[.properties]

# MongoDB connection string comes from the MONGODB_URI environment variable.
# The default below is only for a local MongoDB on your own computer (no credentials).
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/travelora}

# Comma separated list of browser origins allowed to call the API directly.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Never expose stack traces or internal messages in error responses.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
